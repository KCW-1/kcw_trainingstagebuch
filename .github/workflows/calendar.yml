name: Kalender-Abo

# Seit 28.10.2026 aktualisiert der Workflow Push-Erinnerungen (remind.yml) die Kalender-Abos
# alle 15 Minuten mit. Dieser Workflow ist nur noch zum sofortigen Aktualisieren von Hand da
# (Actions, Kalender-Abo, Run workflow).

on:
  workflow_dispatch:

concurrency:
  group: calendar
  cancel-in-progress: false

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: calendar.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node calendar.mjs
        env:
          TZ: Europe/Berlin
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DB_URL: https://kcw-trainingstagebuch-default-rtdb.europe-west1.firebasedatabase.app
          PAGE_URL: https://kcw-1.github.io/kcw_trainingstagebuch/
